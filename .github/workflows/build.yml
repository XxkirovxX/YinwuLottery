name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 最小权限：构建只需要读取仓库内容
permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目编译目标是 Java 21（pom.xml 中 release=21），固定用 21 以保证可复现
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 运行全部 26 个单元测试，其中 FoliaComplianceTest 会检查
      # 生产代码未使用传统调度器/NMS/反射，并校验 plugin.yml 元数据
      - name: Run tests
        run: mvn -B -ntp verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: YinwuLottery-jar
          path: target/YinwuLottery-*.jar
          if-no-files-found: error
          retention-days: 90
